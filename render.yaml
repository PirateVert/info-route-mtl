# Blueprint for https://render.com — one Docker web service.
# The React app and FastAPI /api share one URL.
services:
  - type: web
    name: info-route-mtl
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/
    envVars:
      - key: APP_ORIGIN
        value: https://info-route-mtl.onrender.com
      - key: STRIPE_SECRET_KEY
        sync: false
